[auth_db]
url = "sqlite:////var/lib/alarick_mail/auth.db"
#url = "mysql+pymysql://user:password@host:port/database"
#url = "postgresql://user:password@host:port/database"

[quota]
quota = true
default = 1024
unit = "MB" # B, KB, MB, GB

[smtp]

[smtp.incoming]
bind = "0.0.0.0"
port = 25

[smtp.submission]
use_tls = false
cert_file = "/etc/letsencrypt/live/mail.example.org/fullchain.pem"
key_file = "/etc/letsencrypt/live/mail.example.org/privkey.pem"
bind = "0.0.0.0"
port = 587
